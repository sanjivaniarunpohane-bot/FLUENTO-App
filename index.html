main{max-width:1040px;margin:0 auto;padding:22px 16px 100px}.hero{background:linear-gradient(120deg,#0e6965,#15434d);color:white;border-radius:25px;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(1.5rem,4vw,2.4rem);line-height:1.08;margin:5px 0 9px}.hero p{margin:0;color:#e2f8f2;max-width:520px}.mascot{font-size:76px;flex-shrink:0;filter:drop-shadow(0 8px 8px #001c223d)}.eyebrow{text-transform:uppercase;font-weight:900;font-size:.75rem;letter-spacing:1.3px;color:#bdece2}

@media(max-width:560px){header{padding:10px 12px}.brand{font-size:1.1rem}.brandmark{width:34px;height:34px}.stats{gap:5px}.pill{padding:6px 7px;font-size:.78rem}.hero{padding:19px}.mascot{font-size:57px}.stage{grid-template-columns:46px 1fr;gap:10px}.stage-icon{width:46px;height:46px}.stage>button{grid-column:2;justify-self:start}.stage p{font-size:.83rem}.section-head{align-items:start;flex-direction:column}.question-card{padding:17px}}

.welcome{position:fixed;inset:0;z-index:20;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 18px;background:radial-gradient(circle at 80% 20%,#d7f36a88,transparent 28%),linear-gradient(135deg,#e7faf4,#f7fbff);border-radius:28px;margin:18px 0}

.smallnote{font-size:12px;color:var(--muted)}

for (const [name,c] of Object.entries(extraCourses)) {
 const stages=c.words.map((w,si)=>({title:w[0],desc:["Greetings and polite phrases","Meet people and introduce yourself","Useful food and drink words","Find places around town","Everyday expressions"][si],icon:w[1],lessons:Array.from({length:5},(_,j)=>{
  const pair=(j*2)%((w.length-2)/2), target=w[2+pair*2], meaning=w[3+pair*2];
  const opts=[meaning,w[3+((pair+1)%((w.length-2)/2))*2],w[3+((pair+2)%((w.length-2)/2))*2],"Not sure"].filter((x,i,a)=>a.indexOf(x)===i);
  while(opts.length<4)opts.push(["Goodbye","Thank you","Hello","Please"][opts.length%4]);
  return {q:`What does “${target}” mean?`,opts:opts.slice(0,4),a:meaning,tip:`${target} means “${meaning}”.`};
 })}));
 courses[name]={flag:c.flag,label:c.label,stages};
}

const initial={course:"Spanish",xp:0,hearts:5,streak:1,done:{},earned:[],tab:"learn",name:"Learner",friends:[{name:"Aarav",emoji:"🦊",xp:120},{name:"Mira",emoji:"🐼",xp:95},{name:"Kabir",emoji:"🐯",xp:80}],today:0,lastDay:"",questsClaimed:[],userId:"",welcomeSeen:false,weekDays:[],medals:[],reminderHour:"19:00",lastRewardDay:""};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("fluento-save")||"{}")}}catch{state={...initial}}
let current=null,qi=0,score=0,selected=null,wordAnswer=[];
function save(){localStorage.setItem("fluento-save",JSON.stringify(state));updateStats()}
function enterFluento(){state.welcomeSeen=true;if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();render()}
function currentStage(){const c=getCourse();return c.stages.filter((s,i)=>isDone(i)).length}
function stageLabel(){return "Stage "+Math.min(currentStage()+1,getCourse().stages.length)+" · "+getCourse().label}
function copyFluentoId(){if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(state.userId+" | "+stageLabel()).then(()=>alert("Fluento ID copied!")).catch(()=>prompt("Copy your Fluento ID:",state.userId));else prompt("Copy your Fluento ID:",state.userId)}
function recordDailyPractice(){const today=new Date().toISOString().slice(0,10);if(state.lastDay!==today){const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak=state.lastDay===yesterday?(state.streak||0)+1:1;state.lastDay=today;state.weekDays=state.weekDays||[];state.weekDays.push(today);state.weekDays=[...new Set(state.weekDays)].slice(-7);state.lastRewardDay=today;if(state.weekDays.length>=7&&!state.medals?.includes("🥇")){state.medals=state.medals||[];state.medals.push("🥇");alert("Amazing! You earned the 7-day Gold medal 🥇");}else if(state.streak>=3&&!state.medals?.includes("🥈")){state.medals=state.medals||[];state.medals.push("🥈");}}}
async function enableReminders(){if(!("Notification" in window)){alert("Notifications are not supported in this browser.");return;}const p=await Notification.requestPermission();if(p==="granted"){new Notification("Fluento reminders enabled",{body:"Keep your daily language streak alive! Open Fluento each day to practise."});alert("Notifications allowed. For reliable reminders while the app is closed, Fluento needs a push-notification server; this offline version cannot guarantee background reminders.");}else alert("Notifications were not allowed. You can enable them in your browser settings.");}
function addFriendById(){const id=prompt("Enter your friend's Fluento ID:");if(!id)return;alert("ID lookup needs an online Fluento account server. For now, share your ID and stage with your friend; friends shown here are demo profiles.");}
function updateStats(){document.getElementById("xp").textContent=state.xp;document.getElementById("hearts").textContent=state.hearts;document.getElementById("streak").textContent=state.streak}
function doneKey(si){return state.course+"-"+si}
function isDone(si){return !!state.done[doneKey(si)]}
function isUnlocked(si){return si===0||isDone(si-1)}
function getCourse(){return courses[state.course]}
function setTab(tab){state.tab=tab;save();render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){
 updateStats();const welcome=document.getElementById("welcomeScreen"); if(welcome) welcome.style.display=state.welcomeSeen?"none":"grid"; const app=document.getElementById("app");
 if(state.tab==="learn")app.innerHTML=learnHTML();
 else if(state.tab==="friends")app.innerHTML=friendsHTML();
 else if(state.tab==="quests")app.innerHTML=questsHTML();
 else app.innerHTML=profileHTML();
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
}
function learnHTML(){let c=getCourse(),finished=c.stages.filter((s,i)=>isDone(i)).length,pct=Math.round(finished/c.stages.length*100);
 return `<section class="hero"><div><div class="eyebrow">YOUR DAILY LANGUAGE QUEST</div><h1>Small steps.<br>Big fluency.</h1><p>Learn at your pace with stages, checkpoints, and Ollie cheering you on.</p></div><div class="mascot" aria-label="Ollie the owl">🦉</div></section>
 <div class="section-head"><div><h2>Your learning path</h2><div class="muted">${c.flag} ${c.label} · ${finished}/${c.stages.length} stages completed</div></div></div>
 <div class="panel"><div class="course-row"><label for="courseSelect"><b>Learning language</b></label><select id="courseSelect">${Object.keys(courses).map(k=>`<option ${k===state.course?"selected":""}>${k}</option>`).join("")}</select><span class="muted">Choose a course</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="muted" style="margin-top:7px">${pct}% path complete</div></div>
 <div class="section-head"><h2>Stages</h2><span class="muted">Complete all 5 questions in a stage to unlock the next</span></div>
 <div class="stage-list">${c.stages.map((s,i)=>{let d=isDone(i),u=isUnlocked(i);return `<article class="stage ${u?"":"locked"}"><div class="stage-icon">${d?"✅":u?s.icon:"🔒"}</div><div><h3>${i+1}. ${s.title}</h3><p>${s.desc}</p><div class="stage-meta"><span class="mini">${s.lessons.length} questions</span><span class="mini">${s.checkpoint?"🏁 Checkpoint":"⭐ "+(s.lessons.length*10)+" XP"}</span>${d?'<span class="mini">Completed</span>':""}</div></div><button class="${u?"primary":"secondary"}" ${u?"":"disabled"} onclick="startLesson(${i})">${d?"Practice":s.checkpoint?"Start checkpoint":u?"Start":"Locked"}</button></article>`}).join("")}</div>
 <footer>Fluento is an independent learning project with original branding.</footer>`;
}
function friendsHTML(){let list=[{name:state.name||"You",emoji:"🦉",xp:state.xp,you:true},...state.friends].sort((a,b)=>b.xp-a.xp);
 return `<div class="section-head"><div><h2>Friends Circle 👥</h2><div class="muted">Practice together and celebrate each other's progress.</div></div></div>
 <section class="hero"><div><div class="eyebrow">THIS WEEK</div><h1>Every XP counts!</h1><p>Keep your learning streak going. Demo friends are shown until online accounts are connected.</p></div><div class="mascot">🦉</div></section>
 <div class="panel"><h3>Your Fluento ID</h3><div class="identity"><b id="myFluentoId">${state.userId||"Tap Share ID to create one"}</b><p>${stageLabel()} · ${currentStage()} stages completed</p><button class="primary" onclick="copyFluentoId()">Share / copy my ID</button> <button class="secondary" onclick="addFriendById()">Add friend by ID</button><p class="smallnote">Friends can see your stage only when accounts are connected to an online server. This version stores your progress on this device.</p></div></div>
 <div class="section-head"><h2>Weekly leaderboard</h2><span class="muted">XP totals</span></div>
 <div class="panel">${list.map((f,i)=>`<div class="friend" style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="avatar">${f.emoji}</div><div class="friend-info"><strong>${f.you?"You":escapeText(f.name)} ${f.you?"(you)":""}</strong><small>${f.you?"Your learning journey":"Fluento learner"}</small></div><div class="rank">#${i+1} · ${f.xp} XP</div></div>`).join("")}</div>
 <div class="section-head"><h2>Add a demo friend</h2></div><div class="panel"><p class="muted">This adds a sample profile on this device. It does not send a real invite.</p><div class="course-row"><input id="friendName" placeholder="Friend's nickname" maxlength="20" style="flex:1;min-width:140px;border:1px solid var(--line);padding:11px;border-radius:12px"><button class="primary" onclick="addFriend()">＋ Add friend</button></div></div>`;
}
function questsHTML(){let stages=getCourse().stages,completed=stages.filter((s,i)=>isDone(i)).length,allQuestions=stages.reduce((a,s)=>a+s.lessons.length,0),claimable=completed>=1;
 return `<div class="section-head"><div><h2>Daily quests 🎯</h2><div class="muted">Tiny goals that build a lasting habit.</div></div></div><div class="cards">
 <div class="panel"><div class="achievement">📚</div><h3>Lesson explorer</h3><p class="muted">Complete one stage today.</p><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,completed*100)}%"></div></div><p><b>${Math.min(completed,1)}/1 stage</b></p><button class="${claimable&&!state.questsClaimed.includes("explorer")?"primary":"secondary"}" ${claimable&&!state.questsClaimed.includes("explorer")?"":"disabled"} onclick="claimQuest('explorer',20)">Claim +20 XP</button></div>
 <div class="panel"><div class="achievement">🧠</div><h3>Curious mind</h3><p class="muted">Answer questions and collect XP.</p><p><b>${state.xp} XP collected</b></p><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,state.xp/100*100)}%"></div></div><p class="muted">Reach 100 XP to complete this quest.</p><button class="secondary" disabled>${state.xp>=100?"Goal reached":"Keep learning"}</button></div>
 <div class="panel"><div class="achievement">🔥</div><h3>Come back tomorrow</h3><p class="muted">Return regularly to build your streak.</p><p><b>${state.streak} day streak</b></p><span class="mini">Streak tracking is stored on this device</span></div></div>`;
}
function profileHTML(){let completed=Object.keys(state.done).filter(k=>state.done[k]).length;return `<div class="panel"><h2>🔥 Weekly rewards</h2><p>Practise each day to build your streak and earn medals.</p><div class="reward-row"><div class="reward"><b>🔥</b><span>Daily streak</span></div><div class="reward"><b>🥈</b><span>Silver</span></div><div class="reward"><b>🥇</b><span>Gold</span></div><div class="reward"><b>💎</b><span>Diamond</span></div></div><p><b>Current streak:</b> ${state.streak||0} days · <b>Medals:</b> ${(state.medals||[]).join(" ")||"Keep practising!"}</p><button class="primary" onclick="enableReminders()">Enable reminders</button><p class="smallnote">This version awards streaks and medals locally. It does not delete earned medals for missed days; reminder delivery while the app is closed requires a push server.</p></div><div class="section-head"><div><h2>Your profile 🏆</h2><div class="muted">A record of the progress on this device.</div></div></div><div class="panel"><div class="course-row"><div class="mascot" style="font-size:55px">🦉</div><div style="flex:1"><label for="playerName"><b>Your nickname</b></label><input id="playerName" value="${escapeAttr(state.name||"Learner")}" maxlength="24" style="display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:12px"><button class="secondary" style="margin-top:9px" onclick="saveName()">Save nickname</button></div></div></div><div class="section-head"><h2>Your stats</h2></div><div class="profile-grid"><div class="metric"><strong>⚡ ${state.xp}</strong><span>Total XP</span></div><div class="metric"><strong>🔥 ${state.streak}</strong><span>Day streak</span></div><div class="metric"><strong>✅ ${completed}</strong><span>Stages completed</span></div><div class="metric"><strong>🏅 ${state.earned.length}</strong><span>Badges earned</span></div></div><div class="section-head"><h2>Achievements</h2></div><div class="cards"><div class="panel"><div class="achievement">🌱</div><h3>First Steps</h3><p class="muted">Finish your first stage.</p><span class="mini">${completed>=1?"Unlocked":"Not yet unlocked"}</span></div><div class="panel"><div class="achievement">⭐</div><h3>XP Collector</h3><p class="muted">Earn 100 XP.</p><span class="mini">${state.xp>=100?"Unlocked":"Not yet unlocked"}</span></div><div class="panel"><div class="achievement">🏁</div><h3>Checkpoint Champion</h3><p class="muted">Complete a checkpoint stage.</p><span class="mini">${getCourse().stages.some((s,i)=>s.checkpoint&&isDone(i))?"Unlocked":"Not yet unlocked"}</span></div></div><div class="section-head"><h2>Settings</h2></div><div class="panel"><p class="muted">Your progress is saved locally in this browser. Clearing browser data may erase it.</p><button class="danger" onclick="resetProgress()">Reset progress</button></div>`}
function escapeText(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function escapeAttr(s){return escapeText(s).replace(/'/g,"&#39;")}
document.addEventListener("change",e=>{if(e.target.id==="courseSelect"){state.course=e.target.value;save();render()}});
function startLesson(i){if(!isUnlocked(i))return;current=i;qi=0;score=0;selected=null;showQuestion()}
function showQuestion(){const app=document.getElementById("app"),s=getCourse().stages[current],q=s.lessons[qi];app.innerHTML=`<div class="quiz-shell"><div class="quiz-top"><button class="close-btn" onclick="exitQuiz()" aria-label="Exit lesson">×</button><div class="quiz-progress"><div class="progress-track"><div class="progress-fill" style="width:${qi/s.lessons.length*100}%"></div></div></div><b>❤️ ${state.hearts}</b></div><div class="question-card"><div class="question-type">${s.checkpoint?"🏁 Checkpoint":`Stage ${current+1}`} · Question ${qi+1}/${s.lessons.length}</div><h2>${q.q}</h2><div class="options">${q.opts.map((o,i)=>`<button class="option ${selected===o?"selected":""}" type="button" onclick="chooseAnswer(this)">${escapeText(o)}</button>`).join("")}</div><div id="feedback"></div><div class="quiz-actions"><button class="primary" id="checkBtn" onclick="checkAnswer()" disabled>Check answer</button></div></div><p class="muted" style="text-align:center;margin-top:16px">Ollie says: “You can do it. One question at a time!” 🦉</p></div>`}
function chooseAnswer(button){
 if(!button || !button.classList.contains("option") || button.disabled) return;
 selected=button.textContent.trim();
 document.querySelectorAll(".option").forEach(b=>b.classList.toggle("selected",b===button));
 const btn=document.getElementById("checkBtn");
 if(btn){btn.disabled=false;btn.textContent="Check answer";btn.onclick=checkAnswer;}
}
function checkAnswer(){
 if(typeof selected!=="string" || !selected) return;
 const q=getCourse().stages[current].lessons[qi];
 const chosen=selected;
 const ok=chosen===q.a;
 const fb=document.getElementById("feedback");
 fb.className="feedback "+(ok?"good":"bad");
 fb.textContent=(ok?"Correct! +10 XP. ":"Not quite. ")+q.tip;
 document.querySelectorAll(".option").forEach(b=>{
   b.disabled=true;
   if(b.textContent===q.a)b.classList.add("correct");
   else if(b.textContent===chosen)b.classList.add("wrong");
 });
 const btn=document.getElementById("checkBtn");
 btn.textContent=qi===getCourse().stages[current].lessons.length-1?"Finish stage":"Continue";
 btn.onclick=nextQuestion;
 btn.disabled=false;
 selected=ok ? "__correct__" : "__incorrect__";
}
function nextQuestion(){
 if(selected==="__correct__"){score++;state.xp+=10;}
 else if(selected==="__incorrect__"){state.hearts=Math.max(0,state.hearts-1);}
 qi++;selected=null;save();
 if(qi<getCourse().stages[current].lessons.length)showQuestion();
 else finishLesson();
}
function finishLesson(){let key=doneKey(current),wasDone=!!state.done[key],s=getCourse().stages[current];if(!wasDone){state.done[key]=true;state.xp+=Math.max(0,score*2);if(!state.earned.includes("first")&&Object.values(state.done).some(Boolean))state.earned.push("first");if(s.checkpoint)state.earned.push("checkpoint");}save();document.getElementById("app").innerHTML=`<div class="quiz-shell"><div class="question-card" style="text-align:center"><div style="font-size:74px">${score>=s.lessons.length*.75?"🎉":"🦉"}</div><div class="eyebrow" style="color:var(--teal)">STAGE COMPLETE</div><h2>${score>=s.lessons.length*.75?"Brilliant work!":"Nice effort — keep practising!"}</h2><p>You answered <b>${score} of ${s.lessons.length}</b> questions correctly.</p><div class="profile-grid"><div class="metric"><strong>+${score*10+score*2}</strong><span>XP earned this round</span></div><div class="metric"><strong>${Math.round(score/s.lessons.length*100)}%</strong><span>Accuracy</span></div></div><p class="muted">Ollie says: “Every try helps you grow!”</p><button class="primary" style="width:100%;margin-top:10px" onclick="state.tab='learn';save();render()">Back to learning path</button>${current+1<getCourse().stages.length&&isUnlocked(current+1)?`<button class="secondary" style="width:100%;margin-top:9px" onclick="startLesson(${current+1})">Continue to next stage →</button>`:""}</div></div>`}
function exitQuiz(){current=null;state.tab="learn";render()}
function addFriend(){let el=document.getElementById("friendName"),name=el.value.trim();if(!name){el.focus();return}if(state.friends.some(f=>f.name.toLowerCase()===name.toLowerCase())){alert("That nickname is already in your demo circle.");return}state.friends.push({name,emoji:["🐸","🐨","🦊","🐼","🐯","🐧"][state.friends.length%6],xp:Math.floor(Math.random()*90)});save();render()}
function claimQuest(id,xp){if(state.questsClaimed.includes(id))return;state.questsClaimed.push(id);state.xp+=xp;save();render()}
function saveName(){let el=document.getElementById("playerName");state.name=el.value.trim()||"Learner";save();render()}
function resetProgress(){if(confirm("Reset your XP, stages, and local progress? This cannot be undone.")){state={...initial,friends:[...initial.friends],done:{},earned:[],questsClaimed:[],userId:"",welcomeSeen:false,weekDays:[],medals:[],reminderHour:"19:00",lastRewardDay:""};save();render()}}
updateStats();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
